name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases queue up rather than cancel one another halfway through a push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    # The AWS role trusts main only (OIDC sub ...:ref:refs/heads/main); never add an
    # environment here, it would change the sub claim.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The Dockerfile runs pnpm and next build for the target platform, so arm64 needs QEMU.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/wau/dashboard:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  # Argo CD deploys from wau-services, so the new tag is committed there.
  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wau-captcha/wau-services
          ref: main
          token: ${{ secrets.SERVICES_REPO_TOKEN }}

      - name: Set the dashboard tag in deploy/k3s
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          file=deploy/k3s/kustomization.yaml
          yq -i '(.images[] | select(.name == "wau/dashboard") | .newTag) = strenv(TAG)' "$file"
          # yq ignores names it does not find; a renamed entry must fail the release instead.
          test "$(yq '[.images[] | select(.name == "wau/dashboard" and .newTag == strenv(TAG))] | length' "$file")" = 1
          git diff -- "$file"

      - run: kubectl kustomize deploy/k3s > /dev/null

      - name: Commit and push to wau-services main
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          file=deploy/k3s/kustomization.yaml
          if git diff --quiet -- "$file"; then
            echo "$file already has dashboard $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deploy): release dashboard $TAG [skip ci]" -- "$file"
          for retry in 0 1 2 3; do
            git push origin HEAD:main && exit 0
            [ "$retry" -lt 3 ] || break
            # main moved on (e.g. a services release); replay this commit on top of it.
            git pull --rebase origin main
          done
          exit 1
